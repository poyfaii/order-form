<!doctype html>
<html lang="th">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>รายรับ-รายจ่าย</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="/_sdk/data_sdk.js"></script>
  <style>
    * { font-family: 'Kanit', sans-serif; }
    html, body { height: 100%; width: 100%; margin: 0; padding: 0; }
    body { overflow: auto; }
  </style>
  <style>body { box-sizing: border-box; }</style>
 </head>
 <body class="bg-gradient-to-b from-slate-50 to-slate-100 h-full w-full">
  <div class="w-full h-full overflow-auto">
   <div class="max-w-2xl mx-auto p-4"><!-- Header -->
    <div class="bg-white rounded-2xl shadow-md p-6 mb-6">
     <h1 id="app-title" class="text-3xl font-bold text-gray-800 mb-2">💰 รายรับ-รายจ่าย</h1>
     <p class="text-gray-500">จัดการเงินของคุณได้อย่างง่ายดาย</p>
    </div><!-- Summary Cards -->
    <div class="grid grid-cols-2 gap-4 mb-6">
     <div class="bg-gradient-to-br from-green-400 to-green-600 rounded-2xl shadow-lg p-6 text-white">
      <div class="text-sm opacity-90 mb-2">
       📈 รายรับ
      </div>
      <div id="income-sum" class="text-3xl font-bold">
       ฿0
      </div>
     </div>
     <div class="bg-gradient-to-br from-red-400 to-red-600 rounded-2xl shadow-lg p-6 text-white">
      <div class="text-sm opacity-90 mb-2">
       📉 รายจ่าย
      </div>
      <div id="expense-sum" class="text-3xl font-bold">
       ฿0
      </div>
     </div>
    </div><!-- Net Balance -->
    <div id="balance-card" class="bg-white rounded-2xl shadow-md p-6 mb-6 border-l-4 border-blue-500">
     <div class="text-gray-600 text-sm mb-2">
      💳 ยอดคงเหลือ
     </div>
     <div id="balance" class="text-3xl font-bold text-blue-600">
      ฿0
     </div>
    </div><!-- Add New Record -->
    <div class="bg-white rounded-2xl shadow-md p-6 mb-6">
     <h2 class="text-xl font-bold text-gray-800 mb-4">➕ เพิ่มรายการใหม่</h2>
     <div class="space-y-3">
      <div><label class="block text-sm font-medium text-gray-700 mb-2">ประเภท</label> <select id="type" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"> <option value="income">📈 รายรับ</option> <option value="expense">📉 รายจ่าย</option> </select>
      </div>
      <div><label class="block text-sm font-medium text-gray-700 mb-2">วันที่</label> <input type="date" id="date" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
      </div>
      <div><label class="block text-sm font-medium text-gray-700 mb-2">รายละเอียด</label> <input type="text" id="desc" placeholder="เช่น เงินเดือน, อาหาร, ค่าน้ำ" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
      </div>
      <div><label class="block text-sm font-medium text-gray-700 mb-2">จำนวนเงิน</label> <input type="number" id="amount" placeholder="0" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent" min="0" step="0.01">
      </div><button id="save-btn" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg transition duration-200"> 💾 บันทึก </button>
      <div id="loading" class="hidden text-center text-gray-600 py-2"><span>กำลังบันทึก...</span>
      </div>
     </div>
    </div><!-- Records List -->
    <div class="bg-white rounded-2xl shadow-md p-6">
     <h2 class="text-xl font-bold text-gray-800 mb-4">📋 รายการทั้งหมด</h2>
     <div id="records-list" class="space-y-2">
      <p class="text-gray-500 text-center py-8">ยังไม่มีรายการ</p>
     </div>
    </div>
   </div>
  </div>
  <script>
    let currentData = [];

    const dataHandler = {
      onDataChanged(data) {
        currentData = data || [];
        updateUI();
      }
    };

    const defaultConfig = {
      app_title: '💰 รายรับ-รายจ่าย'
    };

    let config = { ...defaultConfig };

    async function initializeApp() {
      // Initialize Element SDK
      window.elementSdk.init({
        defaultConfig,
        onConfigChange: (newConfig) => {
          config = newConfig;
          document.getElementById('app-title').textContent = config.app_title || defaultConfig.app_title;
        },
        mapToCapabilities: () => ({
          recolorables: [],
          borderables: [],
          fontEditable: undefined,
          fontSizeable: undefined
        }),
        mapToEditPanelValues: () => new Map([
          ['app_title', config.app_title || defaultConfig.app_title]
        ])
      });

      // Initialize Data SDK
      const initResult = await window.dataSdk.init(dataHandler);
      if (!initResult.isOk) {
        console.error('Failed to initialize data SDK');
      }

      setDefaultDate();
      setupEventListeners();
    }

    function setDefaultDate() {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('date').value = today;
    }

    function setupEventListeners() {
      document.getElementById('save-btn').addEventListener('click', addRecord);
    }

    async function addRecord() {
      const type = document.getElementById('type').value;
      const date = document.getElementById('date').value;
      const desc = document.getElementById('desc').value;
      const amount = parseFloat(document.getElementById('amount').value);

      if (!date || !desc || !amount || amount <= 0) {
        alert('กรุณากรอกข้อมูลให้ครบถ้วน');
        return;
      }

      if (currentData.length >= 999) {
        alert('ถึงขีดจำกัด 999 รายการแล้ว');
        return;
      }

      const saveBtn = document.getElementById('save-btn');
      const loading = document.getElementById('loading');
      saveBtn.disabled = true;
      loading.classList.remove('hidden');

      const result = await window.dataSdk.create({
        id: Date.now().toString(),
        type,
        date,
        description: desc,
        amount
      });

      loading.classList.add('hidden');
      saveBtn.disabled = false;

      if (result.isOk) {
        document.getElementById('desc').value = '';
        document.getElementById('amount').value = '';
        setDefaultDate();
      } else {
        alert('เกิดข้อผิดพลาด: ' + result.error.message);
      }
    }

    function updateUI() {
      updateSummary();
      updateRecordsList();
    }

    function updateSummary() {
      const income = currentData
        .filter(r => r.type === 'income')
        .reduce((sum, r) => sum + (r.amount || 0), 0);
      
      const expense = currentData
        .filter(r => r.type === 'expense')
        .reduce((sum, r) => sum + (r.amount || 0), 0);

      const balance = income - expense;

      document.getElementById('income-sum').textContent = '฿' + income.toLocaleString('th-TH', { maximumFractionDigits: 2 });
      document.getElementById('expense-sum').textContent = '฿' + expense.toLocaleString('th-TH', { maximumFractionDigits: 2 });
      document.getElementById('balance').textContent = '฿' + balance.toLocaleString('th-TH', { maximumFractionDigits: 2 });

      const balanceCard = document.getElementById('balance-card');
      if (balance >= 0) {
        balanceCard.classList.remove('border-red-500');
        balanceCard.classList.add('border-blue-500');
        document.getElementById('balance').classList.remove('text-red-600');
        document.getElementById('balance').classList.add('text-blue-600');
      } else {
        balanceCard.classList.remove('border-blue-500');
        balanceCard.classList.add('border-red-500');
        document.getElementById('balance').classList.remove('text-blue-600');
        document.getElementById('balance').classList.add('text-red-600');
      }
    }

    function updateRecordsList() {
      const container = document.getElementById('records-list');
      
      if (currentData.length === 0) {
        container.innerHTML = '<p class="text-gray-500 text-center py-8">ยังไม่มีรายการ</p>';
        return;
      }

      const sorted = [...currentData].sort((a, b) => new Date(b.date) - new Date(a.date));
      container.innerHTML = sorted.map(record => createRecordElement(record)).join('');
    }

    function createRecordElement(record) {
      const isIncome = record.type === 'income';
      const icon = isIncome ? '📈' : '📉';
      const color = isIncome ? 'text-green-600' : 'text-red-600';
      const bgColor = isIncome ? 'bg-green-50' : 'bg-red-50';
      const sign = isIncome ? '+' : '-';

      const dateObj = new Date(record.date);
      const displayDate = dateObj.toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });

      return `
        <div class="${bgColor} rounded-lg p-4 flex justify-between items-center">
          <div class="flex-1">
            <div class="flex items-center gap-2 mb-1">
              <span>${icon}</span>
              <span class="font-semibold text-gray-800">${record.description}</span>
            </div>
            <div class="text-sm text-gray-600">${displayDate}</div>
          </div>
          <div class="flex items-center gap-3">
            <div class="${color} font-bold text-lg">
              ${sign}฿${record.amount.toLocaleString('th-TH', { maximumFractionDigits: 2 })}
            </div>
            <button onclick="deleteRecord('${record.__backendId}')" class="text-gray-400 hover:text-red-600 transition p-1" title="ลบ">
              <i data-lucide="trash-2" style="width: 20px; height: 20px;"></i>
            </button>
          </div>
        </div>
      `;
    }

    async function deleteRecord(id) {
      const record = currentData.find(r => r.__backendId === id);
      if (!record) return;

      const deleteBtn = event.target.closest('button');
      deleteBtn.disabled = true;

      const result = await window.dataSdk.delete(record);
      
      if (!result.isOk) {
        alert('ไม่สามารถลบได้');
        deleteBtn.disabled = false;
      }
    }

    initializeApp();
    lucide.createIcons();
  </script>

</html>
